server:
  port: ${PORT:8090}

spring:
  application:
    name: hevnoraak-hub
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/hevnoraak-hub}
  cache:
    cache-names: cnpj,cep
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h

hub:
  fontes:
    brasilapi:
      url: ${BRASILAPI_URL:https://brasilapi.com.br}
    viacep:
      url: ${VIACEP_URL:https://viacep.com.br}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
